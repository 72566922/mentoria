<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="estudiante/layout :: head"></head>

<body>
<div class="layout">

    <!-- Sidebar -->
    <aside th:replace="estudiante/layout :: sidebar"></aside>

    <!-- Contenido principal -->
    <div class="contenido">
        <header th:replace="estudiante/layout :: header"></header>

        <main>

            <!-- 🔍 Buscar Mentor -->
            <section id="buscar">
                <h2>Buscar Mentor</h2>
                <div class="buscador-box">
                    <input type="text" placeholder="Ejemplo: UX, programación, marketing...">
                    <button>Buscar</button>
                </div>
            </section>

            <!-- 📅 Agendar nueva mentoría -->
            <section id="agendar">
                <h2>Agendar nueva mentoría</h2>

                <form th:action="@{/estudiante/agendar}" method="post">
                    <label>Selecciona mentor</label>
                    <select name="mentorId" required>
                        <option value="">-- Elegir --</option>
                        <option th:each="mentor : ${mentores}"
                                th:value="${mentor.id}"
                                th:text="${mentor.usuario.nombre + ' - ' + mentor.especialidad.nombre}">
                        </option>
                    </select>

                    <label>Tema</label>
                    <input type="text" name="tema" placeholder="Ejemplo: Figma, React, SEO..." required>

                    <label>Fecha</label>
                    <input type="date" name="fecha" required>

                    <label>Hora</label>
                    <input type="time" name="hora" required>

                    <button type="submit">Agendar</button>
                </form>
            </section>

            <!-- 📋 Mentorías Agendadas -->
            <section id="mentorias">
                <h2>Mentorías Agendadas</h2>

                <div th:if="${#lists.isEmpty(sesiones)}">
                    <p>No tienes mentorías agendadas aún.</p>
                </div>

                <div th:each="s : ${sesiones}">
                    <div class="card">
                        <p><strong th:text="${s.tema}">Tema</strong></p>
                        <p>
                            👨‍🏫 <span th:text="${s.mentor.usuario.nombre}"></span> <br>
                            📅 <span th:text="${#temporals.format(s.fechaHora, 'yyyy-MM-dd')}"></span> 🕒 
                            <span th:text="${#temporals.format(s.fechaHora, 'HH:mm')}"></span>
                        </p>
                        <form th:action="@{/estudiante/cancelar}" method="post">
                            <input type="hidden" th:value="${s.id}" name="id">
                            <button type="submit" class="btn-rojo">Cancelar</button>
                        </form>
                    </div>
                </div>
            </section>

        </main>
    </div>

</div>

<!-- 🌐 Scroll suave -->
<script>
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener("click", function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute("href"));
        if (target) {
            target.scrollIntoView({ behavior: "smooth" });
        }
    });
});
</script>

</body>
</html>
