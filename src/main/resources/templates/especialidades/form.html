<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="layout :: head"></head>
<body>
<header th:replace="layout :: header"></header>

<main class="container mt-4">
    <h2 th:text="${especialidad.id != null ? 'Editar Especialidad' : 'Nueva Especialidad'}"></h2>

    <form th:action="@{/especialidades/guardar}" th:object="${especialidad}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" required></textarea>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/especialidades}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>

</body>
</html>
