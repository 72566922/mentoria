<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- 🔹 HEAD -->
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo}">Mentorías Certus</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<!-- 🔹 HEADER -->
<header th:fragment="header">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}">Mentorías Certus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/estudiante/inicio}">Aprendiz</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/login}">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/registro}">Registrarse</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- 🔹 FOOTER -->
<footer th:fragment="footer" class="text-center mt-5 p-4 bg-light border-top">
  <p class="mb-0 text-muted">© 2025 Mentorías Certus - Todos los derechos reservados</p>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
