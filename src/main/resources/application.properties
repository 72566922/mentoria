# ================================
#  NOMBRE DE LA APLICACIÓN
# ================================
spring.application.name=mentoria


# ================================
#  CONFIGURACIÓN BASE DE DATOS
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/mentoria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=morales
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ================================
#  CONFIGURACIÓN JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# ================================
#  CONFIGURACIÓN THYMELEAF
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# ================================
#  CONFIGURACIÓN SPRING SECURITY
# ================================
spring.security.user.name=admin
spring.security.user.password=1234


# ================================
#  PUERTO DEL SERVIDOR (OPCIONAL)
# ================================
# server.port=8080
# ======================================
#  CONFIGURACIÓN GOOGLE OAUTH2 LOGIN
# ======================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
